
workflows:
  ios-appetize:
    name: iPhone Simulator - Appetize
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Descargar dependencias
        script: flutter pub get

      - name: Compilar para simulador iPhone
        script: flutter build ios --simulator --debug

      - name: Comprimir aplicación
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.zip
